# Keeps the SHA-pinned actions in .github/workflows up to date: Dependabot
# bumps the SHA and the `# vX.Y.Z` comment together, one grouped PR a month.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore
