
# .github/workflows/slack-pr-notify.yml
name: Slack PR Notify

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# Least privilege: we only read PR metadata; the Slack post goes out over a webhook.
permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    # Skip drafts — announce a PR to the channel once it's ready for eyes.
    if: github.event.pull_request.draft == false
    steps:
      - name: Post PR creative to Slack
        uses: actions/github-script@v7
        env:
          # Add this repo/org secret: an Incoming Webhook URL from your Slack app.
          # https://api.slack.com/messaging/webhooks
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Which file's creative we care about (this is the "make it yours" canvas).
          TARGET_FILE: profile/README.md
        with:
          script: |
            if (!process.env.SLACK_WEBHOOK_URL) {
              core.setFailed('SLACK_WEBHOOK_URL secret is not set — add it in repo/org secrets.');
              return;
            }

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const TARGET = process.env.TARGET_FILE;

            // The PR's branch may live on a fork, so images must be fetched from the
            // HEAD repo at the HEAD sha, not from this repo.
            const headRepo = pr.head.repo.full_name;   // e.g. "someone/.github"
            const headSha = pr.head.sha;

            // Grab the changed files (with per-file patch) to find the target file's diff.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const target = files.find(f => f.filename === TARGET);

            // Resolve a src referenced inside TARGET into a public raw URL on the PR branch.
            // Absolute http(s) URLs are used as-is; repo-relative paths resolve against
            // the directory that holds TARGET.
            const baseDir = TARGET.includes('/') ? TARGET.replace(/\/[^/]*$/, '') : '';
            function toRawUrl(src) {
              src = src.trim().replace(/^['"]|['"]$/g, '');
              if (/^https?:\/\//i.test(src)) return src;
              if (src.startsWith('//')) return 'https:' + src;
              let path = src.startsWith('/')
                ? src.slice(1)
                : (baseDir ? baseDir + '/' + src : src);
              // Normalize ./ and ../ segments.
              const parts = [];
              for (const seg of path.split('/')) {
                if (seg === '' || seg === '.') continue;
                if (seg === '..') parts.pop();
                else parts.push(seg);
              }
              return `https://raw.githubusercontent.com/${headRepo}/${headSha}/${parts.map(encodeURIComponent).join('/')}`;
            }

            // Pull image references out of only the ADDED lines of the target's diff,
            // so we surface what THIS PR contributes, not what was already there.
            const images = []; // { url, alt }
            const seen = new Set();
            function add(url, alt) {
              if (!url || seen.has(url)) return;
              seen.add(url);
              images.push({ url, alt: alt || 'PR creative' });
            }

            if (target && target.patch) {
              const added = target.patch
                .split('\n')
                .filter(l => l.startsWith('+') && !l.startsWith('+++'))
                .map(l => l.slice(1))
                .join('\n');

              // Markdown images: ![alt](url)
              for (const m of added.matchAll(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g)) {
                add(toRawUrl(m[2]), m[1]);
              }
              // HTML <img src="url" alt="...">
              for (const m of added.matchAll(/<img\b[^>]*?\bsrc\s*=\s*(['"])(.*?)\1[^>]*>/gi)) {
                const altMatch = m[0].match(/\balt\s*=\s*(['"])(.*?)\1/i);
                add(toRawUrl(m[2]), altMatch ? altMatch[2] : '');
              }
            }

            // Slack image blocks only render raster formats reachably (png/jpg/gif/webp);
            // SVGs (e.g. shields.io badges) don't render, so keep them out of image blocks.
            const RASTER = /\.(png|jpe?g|gif|webp)(\?|#|$)/i;
            const renderable = images.filter(i => RASTER.test(i.url)).slice(0, 8);

            const blocks = [
              { type: 'header', text: { type: 'plain_text', text: `🎨 New PR: ${pr.title}`.slice(0, 150), emoji: true } },
              {
                type: 'section',
                fields: [
                  { type: 'mrkdwn', text: `*Author:*\n<${pr.user.html_url}|@${pr.user.login}>` },
                  { type: 'mrkdwn', text: `*Repo:*\n${owner}/${repo}` },
                ],
              },
            ];

            if (renderable.length) {
              blocks.push({ type: 'section', text: { type: 'mrkdwn', text: `*${renderable.length} new creative(s)* added to \`${TARGET}\`:` } });
              for (const img of renderable) {
                blocks.push({
                  type: 'image',
                  image_url: img.url,
                  alt_text: (img.alt || 'PR creative').slice(0, 2000),
                });
              }
            } else if (target) {
              blocks.push({ type: 'section', text: { type: 'mrkdwn', text: `\`${TARGET}\` was changed, but no new renderable image was found in the additions.` } });
            } else {
              blocks.push({ type: 'section', text: { type: 'mrkdwn', text: `This PR doesn't touch \`${TARGET}\`.` } });
            }

            blocks.push({
              type: 'actions',
              elements: [
                { type: 'button', text: { type: 'plain_text', text: 'View PR', emoji: true }, url: pr.html_url, style: 'primary' },
              ],
            });

            const res = await fetch(process.env.SLACK_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: `New PR #${pr.number}: ${pr.title}`, blocks }),
            });

            if (!res.ok) {
              core.setFailed(`Slack webhook returned ${res.status}: ${await res.text()}`);
              return;
            }
            console.log(`Posted PR #${pr.number} to Slack with ${renderable.length} image(s).`);
