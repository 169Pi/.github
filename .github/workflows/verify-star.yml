
# .github/workflows/verify-star.yml
name: Verify Star

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Explicitly declare token permissions (principle of least privilege)
permissions:
  pull-requests: write   # Needed to comment on the PR
  contents: read         # Needed for basic repo access

jobs:
  check-star:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR author has starred the repo
        uses: actions/github-script@v7
        with:
          # Classic PAT with `public_repo` scope — the built-in GITHUB_TOKEN
          # is scoped to this repo and cannot read stargazers on Alpie-Core.
          github-token: ${{ secrets.STAR_CHECK_TOKEN }}
          script: |
            const prAuthor = context.payload.pull_request.user.login;
            const owner = '169Pi';
            const repo = 'Alpie-Core';
            const marker = '<!-- verify-star-bot:comment -->';
            const askBody = `${marker}\n👋 Hey @${prAuthor}! Please ⭐ star [${owner}/${repo}](https://github.com/${owner}/${repo}) before your PR can be reviewed. Once you have, re-run this check.`;
            const thanksBody = `${marker}\n🎉 Thanks for starring [${owner}/${repo}](https://github.com/${owner}/${repo}), @${prAuthor}! Your PR is good to go.`;

            console.log(`Checking if ${prAuthor} has starred ${owner}/${repo}...`);

            let hasStarred = false;
            let page = 1;
            while (true) {
              const { data: stargazers } = await github.rest.activity.listStargazersForRepo({
                owner,
                repo,
                per_page: 100,
                page,
              });
              if (stargazers.length === 0) break;
              if (stargazers.some(u => u.login.toLowerCase() === prAuthor.toLowerCase())) {
                hasStarred = true;
                break;
              }
              if (stargazers.length < 100) break;
              page++;
            }

            // Find any prior comment this workflow left, so we can update
            // it instead of stacking new ones on every re-run.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (hasStarred) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: thanksBody,
                });
              }
              console.log(`✅ ${prAuthor} has starred the repo.`);
            } else {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: askBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: askBody,
                });
              }
              core.setFailed(`@${prAuthor} has not starred ${owner}/${repo}.`);
            }
