
# .github/workflows/verify-star.yml
name: Verify Star

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Explicitly declare token permissions (principle of least privilege)
permissions:
  pull-requests: write   # Needed to comment on the PR
  contents: read         # Needed for basic repo access

jobs:
  check-star:
    runs-on: ubuntu-latest
    steps:
      - name: Check star and welcome the contributor
        uses: actions/github-script@v7
        with:
          # Classic PAT with `public_repo` scope — the built-in GITHUB_TOKEN
          # is scoped to this repo and cannot read stargazers on Alpie-Core.
          github-token: ${{ secrets.STAR_CHECK_TOKEN }}
          script: |
            const prAuthor = context.payload.pull_request.user.login;
            const owner = '169Pi';
            const repo = 'Alpie-Core';
            const repoLink = `[${owner}/${repo}](https://github.com/${owner}/${repo})`;

            // Hidden marker so we update one comment instead of spamming the
            // thread on every push (this workflow runs on `synchronize` too).
            const MARKER = '<!-- verify-star-bot -->';

            // Only act on wall-entry PRs — ones that touch profile/README.md.
            // Infra/maintainer PRs (workflows, CONTRIBUTING, README, etc.) are
            // left untouched: no label, no star gate, no comment.
            const ENTRY_FILE = 'profile/README.md';
            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const isEntryPR = changedFiles.some(f => f.filename === ENTRY_FILE);
            if (!isEntryPR) {
              console.log(`PR does not modify ${ENTRY_FILE} — not a wall entry, skipping.`);
              return;
            }

            // Auto-label new entry PRs. Only on `opened` so a maintainer can
            // remove the label later without the next push re-adding it.
            // `addLabels` creates the label if it doesn't exist yet.
            if (context.payload.action === 'opened') {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels: ['good first alpie'],
                });
                console.log('Added "good first alpie" label.');
              } catch (e) {
                console.log(`Could not add label: ${e.message}`);
              }
            }

            console.log(`Checking if ${prAuthor} has starred ${owner}/${repo}...`);

            let hasStarred = false;
            let page = 1;

            // Paginate through stargazers to find the PR author
            while (true) {
              const { data: stargazers } = await github.rest.activity.listStargazersForRepo({
                owner,
                repo,
                per_page: 100,
                page,
              });

              if (stargazers.length === 0) break;

              if (stargazers.some(user => user.login === prAuthor)) {
                hasStarred = true;
                break;
              }

              // Stop paginating if we got fewer than 100 results (last page)
              if (stargazers.length < 100) break;
              page++;
            }

            // ── Auto-verify each contribution step ─────────────────────────
            // Every item below is checked programmatically. The star stays the
            // only hard gate (it fails the workflow); the rest are advisory —
            // they render green/pending so contributors can self-correct before
            // a maintainer reviews. All of it re-runs on every push.
            const ENTRY_MARKER_START = 'ENTRIES:START';
            const ENTRY_MARKER_END = 'ENTRIES:END';
            const profileUrl = `https://github.com/${prAuthor}`;

            // Diff + final content of the entry file, fetched once and reused.
            const entryFile = changedFiles.find(f => f.filename === ENTRY_FILE);
            const patch = (entryFile && entryFile.patch) || '';
            const addedLines = patch
              .split('\n')
              .filter(l => l.startsWith('+') && !l.startsWith('+++'))
              .map(l => l.slice(1));

            // New-file line numbers of every added line, parsed from the diff.
            const addedLineNos = [];
            {
              let newLine = 0;
              for (const l of patch.split('\n')) {
                const h = l.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (h) { newLine = parseInt(h[1], 10); continue; }
                if (l.startsWith('+++') || l.startsWith('---')) continue;
                if (l.startsWith('+')) { addedLineNos.push(newLine); newLine++; }
                else if (l.startsWith('-')) { /* old-side only, no new line */ }
                else { newLine++; }
              }
            }

            // Final (head) content, to locate the ENTRIES markers by line.
            let headLines = null;
            try {
              const { data: fileData } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: ENTRY_FILE,
                ref: context.payload.pull_request.head.sha,
              });
              headLines = Buffer.from(fileData.content, 'base64')
                .toString('utf8')
                .split('\n');
            } catch (e) {
              console.log(`Could not fetch head content of ${ENTRY_FILE}: ${e.message}`);
            }

            // 1. Title format: `@handle: <something>`
            const title = context.payload.pull_request.title || '';
            const titleOk = /^@[A-Za-z0-9-]+:\s*\S+/.test(title);

            // 2. Entry lives strictly between the ENTRIES markers.
            let zoneStatus = 'skip';
            let zoneNote = '';
            if (headLines) {
              const startIdx = headLines.findIndex(l => l.includes(ENTRY_MARKER_START));
              const endIdx = headLines.findIndex(l => l.includes(ENTRY_MARKER_END));
              if (startIdx === -1 || endIdx === -1 || startIdx >= endIdx) {
                zoneStatus = 'fail';
                zoneNote = 'keep both `<!-- ENTRIES:START -->` and `<!-- ENTRIES:END -->` markers in place';
              } else if (addedLineNos.length === 0) {
                zoneStatus = 'fail';
                zoneNote = 'no new lines detected in `profile/README.md`';
              } else {
                const startLine = startIdx + 1; // getContent is 0-indexed; diff is 1-indexed
                const endLine = endIdx + 1;
                const outside = addedLineNos.some(n => n <= startLine || n >= endLine);
                zoneStatus = outside ? 'fail' : 'pass';
                if (outside) zoneNote = 'some changes are outside the entry zone — add your entry between the markers only';
              }
            }

            // 3. Public attribution: a linked "Contributed by" line in the additions.
            const attributionOk = addedLines.some(l =>
              /contributed by\s*\[[^\]]+\]\(https?:\/\/[^)]+\)/i.test(l));

            // 4. Self-contained: no external images or scripts in the additions.
            const externalAsset = addedLines.some(l =>
              /<script\b/i.test(l) ||
              /<img\b[^>]*src\s*=\s*["']https?:/i.test(l) ||
              /!\[[^\]]*\]\(https?:\/\//.test(l));
            const selfContainedOk = !externalAsset;

            // 5. Single open PR by this author in this repo.
            let onePrStatus = 'skip';
            try {
              const openPRs = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              const mine = openPRs.filter(p => p.user && p.user.login === prAuthor);
              onePrStatus = mine.length <= 1 ? 'pass' : 'fail';
            } catch (e) {
              console.log(`Could not list open PRs: ${e.message}`);
            }

            // Render one checklist line from a status + label (+ optional hint).
            const renderItem = (status, label, note) =>
              status === 'pass'
                ? `- [x] ${label}`
                : status === 'skip'
                  ? `- [ ] ${label} — couldn't auto-check, please self-confirm`
                  : `- [ ] ${label}${note ? ` — ${note}` : ''}`;

            const items = [
              {
                status: hasStarred ? 'pass' : 'fail',
                label: hasStarred
                  ? `⭐ Starred ${repoLink}`
                  : `⭐ **Star ${repoLink}** — required before review`,
              },
              {
                status: titleOk ? 'pass' : 'fail',
                label: 'Title follows `@your-handle: <what you\'re calling it>`',
                note: 'rename the PR to `@your-handle: <title>`',
              },
              {
                status: zoneStatus,
                label: 'Entry added between the `ENTRIES:START` / `ENTRIES:END` markers in `profile/README.md`',
                note: zoneNote,
              },
              {
                status: attributionOk ? 'pass' : 'fail',
                label: 'Public attribution so you get credited on the wall',
                note: `add a \`**Contributed by [@you](${profileUrl})**\` line to your entry`,
              },
              {
                status: selfContainedOk ? 'pass' : 'fail',
                label: 'Original & self-contained (inline SVG / ASCII / Markdown — no external images or scripts)',
                note: 'remove external images/scripts and inline your work',
              },
              {
                status: onePrStatus,
                label: 'This is your only open PR right now',
              },
            ];

            const checklist = items.map(i => renderItem(i.status, i.label, i.note)).join('\n');

            const autoItems = items.filter(i => i.status !== 'skip');
            const passing = autoItems.filter(i => i.status === 'pass').length;
            const summary = `**Auto-checks: ${passing}/${autoItems.length} passing.** These update automatically each time you push.`;

            // First-timers get the full warm onboarding; returning contributors
            // (anyone who has landed a PR here before, plus members/owners) get a
            // shorter "welcome back". `author_association` is GitHub's own signal:
            // FIRST_TIME_CONTRIBUTOR/FIRST_TIMER/NONE until they have a merged PR.
            const RETURNING = ['CONTRIBUTOR', 'MEMBER', 'OWNER', 'COLLABORATOR'];
            const firstTimer = !RETURNING.includes(
              context.payload.pull_request.author_association);

            const CONTRIB_LINK = '[`CONTRIBUTING.md`](https://github.com/169Pi/.github/blob/main/CONTRIBUTING.md)';
            const DISCORD_LINK = '[Discord](https://discord.com/invite/QqkrMmvt4)';

            const greeting = !hasStarred
              ? (firstTimer
                  ? `👋 Hey @${prAuthor}, thanks for contributing to the wall!`
                  : `👋 Welcome back, @${prAuthor}!`)
              : (firstTimer
                  ? `🎉 Thanks for your entry, @${prAuthor} — welcome to the wall!`
                  : `🎉 Welcome back to the wall, @${prAuthor}!`);

            const starAsk = hasStarred
              ? null
              : `One thing first: please ⭐ star ${repoLink} — a bot checks this, and it's how we know who's on the wall. Once you've starred, push any commit (or re-run this check) and it'll go green.`;

            const statusLine = hasStarred
              ? (firstTimer
                  ? 'Your star checks out. ⭐ Here\'s where your entry stands — I re-check these on every push:'
                  : 'Star\'s good. ⭐ Quick status on this entry — re-checked on every push:')
              : 'While you\'re here, here\'s where the rest of your entry stands — I re-check these on every push:';

            const footer = firstTimer
              ? `New here? The full guide is in ${CONTRIB_LINK}. We review every two weeks — hang out on ${DISCORD_LINK} while you wait. 🧠`
              : `You know the drill — ${CONTRIB_LINK} if you need a refresher, and the crew's on ${DISCORD_LINK}. See you at the next merge. 🧠`;

            const body = [
              MARKER,
              greeting,
              '',
              ...(starAsk ? [starAsk, ''] : []),
              statusLine,
              '',
              summary,
              '',
              checklist,
              '',
              footer,
            ].join('\n');

            // Upsert: find our previous comment (by marker) and edit it,
            // otherwise create a fresh one.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

            if (!hasStarred) {
              // Fail the workflow to block the PR until they star.
              core.setFailed(`@${prAuthor} has not starred ${owner}/${repo}.`);
            } else {
              console.log(`✅ ${prAuthor} has starred the repo. Proceeding.`);
            }
