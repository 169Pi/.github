# .github/workflows/verify-star.yml
name: Verify Star

on:
  pull_request_target:
    # `edited` so a title fix re-runs the title check.
    types: [opened, synchronize, reopened, edited]

# Explicitly declare token permissions (principle of least privilege)
permissions:
  pull-requests: write   # Comment, label, and close duplicate PRs
  issues: write          # Create the needs-changes / ready-for-review labels
  contents: read         # Read the base branch's check script

# One run per PR at a time, so a fast push doesn't race the previous comment.
concurrency:
  group: verify-star-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-star:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the BASE branch, never the fork — the
      # PR's content is only ever read through the API inside the script.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check the entry and update the checklist
        uses: actions/github-script@v7
        with:
          # Retry transient API errors (5xx, rate limits) instead of failing the run.
          retries: 3
          # Classic PAT with `public_repo` scope — the built-in GITHUB_TOKEN
          # is scoped to this repo and cannot read stargazers on Alpie-Core.
          # Labels it adds also trigger slack-pr-notify (GITHUB_TOKEN's wouldn't).
          github-token: ${{ secrets.STAR_CHECK_TOKEN }}
          script: |
            const { evaluate } = require('./.github/scripts/wall-checks.js');
            await evaluate({
              github, context, core,
              pr: context.payload.pull_request,
              action: context.payload.action,
            });
