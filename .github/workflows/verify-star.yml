# .github/workflows/verify-star.yml
name: Verify Star

on:
  pull_request_target:
    # `edited` so a title fix re-runs the title check.
    types: [opened, synchronize, reopened, edited]

# Explicitly declare token permissions (principle of least privilege)
permissions:
  pull-requests: write   # Comment, label, and close duplicate PRs
  issues: write          # Create the needs-changes / ready-for-review labels
  contents: read         # Read the base branch's check script

# One run per PR at a time, so a fast push doesn't race the previous comment.
concurrency:
  group: verify-star-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-star:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the BASE branch, never the fork — the
      # PR's content is only ever read through the API inside the script.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Act as the 169pi wall bot (a GitHub App) instead of a personal account.
      # Skipped until the App is set up, in which case we fall back to the PAT.
      # App tokens also trigger downstream workflows (slack-pr-notify on labels).
      - name: Mint the wall bot token
        id: app-token
        if: vars.WALL_BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WALL_BOT_CLIENT_ID }}
          private-key: ${{ secrets.WALL_BOT_PRIVATE_KEY }}
          owner: 169Pi
          # Alpie-Core for the stargazer check, .github for everything else.
          repositories: .github,Alpie-Core
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Check the entry and update the checklist
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          # Whose comments count as the bot's: the App's account, plus the
          # account that posted them before the App existed.
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || '' }}
          LEGACY_BOT_LOGINS: kindavishal
        with:
          # Retry transient API errors (5xx, rate limits) instead of failing the run.
          retries: 3
          # The built-in GITHUB_TOKEN can't read Alpie-Core's stargazers, and its
          # labels wouldn't trigger slack-pr-notify — so App token, else the PAT.
          github-token: ${{ steps.app-token.outputs.token || secrets.STAR_CHECK_TOKEN }}
          script: |
            const { evaluate } = require('./.github/scripts/wall-checks.js');
            await evaluate({
              github, context, core,
              pr: context.payload.pull_request,
              action: context.payload.action,
            });
