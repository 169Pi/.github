
# .github/workflows/verify-star.yml
name: Verify Star

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Explicitly declare token permissions (principle of least privilege)
permissions:
  pull-requests: write   # Needed to comment on the PR
  contents: read         # Needed for basic repo access

jobs:
  check-star:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR author has starred the repo
        uses: actions/github-script@v7
        with:
          script: |
            const prAuthor = context.payload.pull_request.user.login;
            const owner = '169Pi';
            const repo = 'Alpie-Core';

            console.log(`Checking if ${prAuthor} has starred ${owner}/${repo}...`);

            // Listing stargazers is a public endpoint, but the workflow's
            // built-in GITHUB_TOKEN is a GitHub App scoped to this repo only —
            // it can't reach 169Pi/Alpie-Core and returns 403. So we call the
            // endpoint unauthenticated; the response is public data either way.
            let hasStarred = false;
            let page = 1;

            while (true) {
              const res = await fetch(
                `https://api.github.com/repos/${owner}/${repo}/stargazers?per_page=100&page=${page}`,
                {
                  headers: {
                    'Accept': 'application/vnd.github+json',
                    'User-Agent': 'verify-star-workflow',
                    'X-GitHub-Api-Version': '2022-11-28',
                  },
                }
              );

              if (!res.ok) {
                core.setFailed(`Stargazer lookup failed: ${res.status} ${res.statusText}`);
                return;
              }

              const stargazers = await res.json();
              if (!Array.isArray(stargazers) || stargazers.length === 0) break;

              if (stargazers.some(u => u.login.toLowerCase() === prAuthor.toLowerCase())) {
                hasStarred = true;
                break;
              }

              if (stargazers.length < 100) break;
              page++;
            }

            if (!hasStarred) {
              // Post a comment asking them to star the repo
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `👋 Hey @${prAuthor}! Please ⭐ star the [${owner}/${repo}](https://github.com/${owner}/${repo}) repository before your PR can be reviewed. Once done, re-run the check!`,
              });

              // Fail the workflow to block the PR
              core.setFailed(`@${prAuthor} has not starred ${owner}/${repo}.`);
            } else {
              console.log(`✅ ${prAuthor} has starred the repo. Proceeding.`);
            }
