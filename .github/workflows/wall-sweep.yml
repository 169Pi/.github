# .github/workflows/wall-sweep.yml
name: Wall Sweep

# Daily: re-check every PR sitting on `needs-changes` (picks up late stars and
# rule changes), nudge the ones still red (day 3, day 7 after the last push),
# and close them if the final nudge goes unanswered (day 10). Run it by hand
# with `recheck` to put every open PR through the checks, not just red ones
# (it labels + comments, it doesn't fail anything). PRs labelled `wall-exempt`
# are left alone.
on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST
  workflow_dispatch:
    inputs:
      recheck:
        description: 'Re-check every open PR first (otherwise only red ones, and not on a dry run)'
        type: boolean
        default: false
      dry_run:
        description: 'Log which PRs would be nudged or closed, without acting'
        type: boolean
        default: true

permissions:
  pull-requests: write
  issues: write
  contents: read

concurrency:
  group: wall-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Act as the 169pi wall bot (a GitHub App) instead of a personal account.
      # Skipped until the App is set up, in which case we fall back to the PAT.
      # App tokens also trigger downstream workflows (slack-pr-notify on labels).
      - name: Mint the wall bot token
        id: app-token
        if: vars.WALL_BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WALL_BOT_CLIENT_ID }}
          private-key: ${{ secrets.WALL_BOT_PRIVATE_KEY }}
          owner: 169Pi
          # Alpie-Core for the stargazer check, .github for everything else.
          repositories: .github,Alpie-Core
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Re-check and close stale PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Whose comments count as the bot's: the App's account, plus the
          # account that posted them before the App existed.
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || '' }}
          LEGACY_BOT_LOGINS: kindavishal
        with:
          # Retry transient API errors (5xx, rate limits) instead of failing the run.
          retries: 3
          # The built-in GITHUB_TOKEN can't read Alpie-Core's stargazers, and its
          # labels wouldn't trigger slack-pr-notify — so App token, else the PAT.
          github-token: ${{ steps.app-token.outputs.token || secrets.STAR_CHECK_TOKEN }}
          script: |
            const { sweep } = require('./.github/scripts/wall-checks.js');
            // Scheduled runs have no inputs: re-check red PRs, then nudge/close for real.
            await sweep({
              github, context, core,
              recheck: ${{ inputs.recheck == true }},
              dryRun: ${{ inputs.dry_run == true }},
            });
