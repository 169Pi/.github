# .github/workflows/wall-sweep.yml
name: Wall Sweep

# Daily: re-check every PR sitting on `needs-changes` (picks up late stars and
# rule changes), nudge the ones still red (day 3, day 7 after the last push),
# and close them if the final nudge goes unanswered (day 10). Run it by hand
# with `recheck` to put every open PR through the checks, not just red ones
# (it labels + comments, it doesn't fail anything). PRs labelled `wall-exempt`
# are left alone.
on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST
  workflow_dispatch:
    inputs:
      recheck:
        description: 'Re-check every open PR first (otherwise only red ones, and not on a dry run)'
        type: boolean
        default: false
      dry_run:
        description: 'Log which PRs would be nudged or closed, without acting'
        type: boolean
        default: true

permissions:
  pull-requests: write
  issues: write
  contents: read

concurrency:
  group: wall-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Re-check and close stale PRs
        uses: actions/github-script@v7
        with:
          # Retry transient API errors (5xx, rate limits) instead of failing the run.
          retries: 3
          github-token: ${{ secrets.STAR_CHECK_TOKEN }}
          script: |
            const { sweep } = require('./.github/scripts/wall-checks.js');
            // Scheduled runs have no inputs: re-check red PRs, then nudge/close for real.
            await sweep({
              github, context, core,
              recheck: ${{ inputs.recheck == true }},
              dryRun: ${{ inputs.dry_run == true }},
            });
