<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08201E"/>
      <stop offset="50%" stop-color="#134E4A"/>
      <stop offset="100%" stop-color="#0A2A28"/>
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="center-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Card Tile -->
  <rect width="300" height="300" rx="28" fill="url(#tile-bg)"/>
  <rect width="298" height="298" x="1" y="1" rx="27" fill="none" stroke="#10B981" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Subtle Radial Background Glow -->
  <circle cx="150" cy="130" r="85" fill="url(#center-glow)"/>

  <!-- Offline / Local Model Circuit Ring -->
  <circle cx="150" cy="130" r="70" fill="none" stroke="#0284C7" stroke-dasharray="5 7" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Central Motif: Steaming Chai Cup + Terminal Cursor (Local AI in India) -->
  <g transform="translate(150, 130)">
    <!-- Terminal Prompt Steam '>' -->
    <path d="M -20 -48 L -8 -36 L -20 -24" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Terminal Cursor Line '_' (Accent Highlight: Warm Amber #F59E0B) -->
    <line x1="-2" y1="-24" x2="16" y2="-24" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Soft Steam Swirls -->
    <path d="M -6 -12 Q -12 -22 -4 -30" fill="none" stroke="#10B981" stroke-width="1.8" stroke-opacity="0.4" stroke-linecap="round"/>
    <path d="M 8 -12 Q 14 -22 8 -30" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- Chai Kulhad / Cup Silhouette -->
    <path d="M -30 -2 L 30 -2 Q 22 42 0 44 Q -22 42 -30 -2 Z" fill="#134E4A" stroke="#10B981" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Cup Band Accent -->
    <path d="M -26 12 L 26 12" fill="none" stroke="#0284C7" stroke-width="2.5"/>

    <!-- Local AI Hardware Node Dot -->
    <circle cx="0" cy="28" r="3.5" fill="#F59E0B"/>
  </g>

  <!-- Tag: #GoodFirstAlpie -->
  <g transform="translate(24, 32)">
    <rect x="0" y="0" width="124" height="22" rx="11" fill="#10B981" fill-opacity="0.12"/>
    <text x="11" y="15" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" font-weight="700" fill="#10B981" letter-spacing="0.4">#GoodFirstAlpie</text>
  </g>

  <!-- Name Label: henrimarconni -->
  <g transform="translate(24, 252)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" letter-spacing="0.3">henrimarconni</text>
    <text x="0" y="16" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" font-weight="500" fill="#0284C7" letter-spacing="0.2">169pi contributor</text>
  </g>

  <!-- Corner Offline Status Indicator -->
  <g transform="translate(262, 252)">
    <circle cx="0" cy="0" r="5" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
</svg>
