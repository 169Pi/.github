<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">

  <!-- Background -->
  <rect width="200" height="200" fill="#134E4A" rx="12"/>

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="184" height="184" fill="none"
        stroke="#10B981" stroke-width="1" stroke-opacity="0.25" rx="8"/>

  <!-- Monitor body -->
  <rect x="52" y="54" width="96" height="66" fill="#0F3D39" rx="6"
        stroke="#10B981" stroke-width="1.5"/>

  <!-- Monitor screen -->
  <rect x="60" y="62" width="80" height="50" fill="#134E4A" rx="3"/>

  <!-- Screen glow line - offline/local indicator -->
  <rect x="68" y="78" width="48" height="3" fill="#10B981" rx="1.5"/>
  <rect x="68" y="86" width="32" height="3" fill="#10B981" opacity="0.5" rx="1.5"/>
  <rect x="68" y="94" width="40" height="3" fill="#10B981" opacity="0.3" rx="1.5"/>

  <!-- Monitor stand neck -->
  <rect x="94" y="120" width="12" height="12" fill="#0F3D39"/>

  <!-- Monitor base -->
  <rect x="76" y="132" width="48" height="6" fill="#0F3D39" rx="3"
        stroke="#10B981" stroke-width="1"/>

  <!-- Grey highlight dot - single accent -->
  <circle cx="156" cy="48" r="5" fill="#9CA3AF"/>

  <!-- 169Pi label -->
  <text x="100" y="158" font-family="monospace" font-size="8"
        fill="#10B981" opacity="0.55" text-anchor="middle"
        letter-spacing="2">169Pi</text>

  <!-- Contributor name -->
  <text x="100" y="172" font-family="sans-serif" font-size="10"
        fill="#ffffff" font-weight="600" text-anchor="middle"
        letter-spacing="1">furyolen</text>

  <!-- GoodFirstAlpie tag -->
  <rect x="34" y="180" width="132" height="14" fill="#0284C7"
        fill-opacity="0.12" rx="4"/>
  <text x="100" y="190" font-family="sans-serif" font-size="7.5"
        fill="#0284C7" text-anchor="middle"
        letter-spacing="0.4">#GoodFirstAlpie</text>

</svg>
